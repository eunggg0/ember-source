[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=10.15']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=10.15']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=10.15']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'
[built-in options]
c_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=10.15']
[properties]
pkg_config_libdir = ['$WORK/gstx64/pc', '$WORK/gstx64/prefix/lib/pkgconfig']
[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
